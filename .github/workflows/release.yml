name: Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------------
  # Linux: Native Fedora RPM Package (Primary) & Portable Tarball
  # -----------------------------------------------------------------
  build-linux-fedora:
    name: Build Linux (Fedora RPM & Tarball)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Fedora build dependencies
        run: |
          dnf install -y \
            git \
            gcc-c++ \
            cmake \
            ninja-build \
            rpm-build \
            vulkan-loader-devel \
            vulkan-headers \
            glslc \
            SDL3-devel \
            zlib-ng-compat-devel \
            tar \
            gzip

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NATIVE_OPTIMIZATION=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run unit tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package RPM & Tarball with CPack
        run: |
          cd build && cpack -G "RPM;TGZ"
          mkdir -p ../dist
          cp *.rpm *.tar.gz ../dist/

      - name: Upload Linux RPM & Tarball Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathways-linux-packages
          path: dist/*
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Windows: MSVC x64 Standalone Zip Package
  # -----------------------------------------------------------------
  build-windows:
    name: Build Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows dependencies (vcpkg)
        run: |
          vcpkg install zlib:x64-windows

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest

      - name: Configure CMake (Windows)
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CONFIGURATION_TYPES=Release \
            -DENABLE_NATIVE_OPTIMIZATION=OFF \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }};C:/vcpkg/installed/x64-windows" \
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Windows)
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Package Release (Windows)
        shell: bash
        run: |
          mkdir -p package/shaders package/scenes
          if [ -f "build/bin/Release/pathways.exe" ]; then
            cp build/bin/Release/pathways.exe package/
            cp build/bin/Release/*.dll package/ 2>/dev/null || true
          elif [ -f "build/bin/pathways.exe" ]; then
            cp build/bin/pathways.exe package/
            cp build/bin/*.dll package/ 2>/dev/null || true
          fi
          # Copy SDL3.dll from SDL3 prefix
          find "${{ steps.sdl.outputs.prefix }}" -name "SDL3.dll" -exec cp {} package/ \; 2>/dev/null || true
          # Copy zlib1.dll from vcpkg
          find "C:/vcpkg/installed/x64-windows/bin" -name "*.dll" -exec cp {} package/ \; 2>/dev/null || true
          # Copy compiled shaders
          cp build/shaders/*.spv package/shaders/ 2>/dev/null || cp build/bin/shaders/*.spv package/shaders/ 2>/dev/null || true
          cp -r scenes/* package/scenes/ 2>/dev/null || true
          cp README.md package/ 2>/dev/null || true
          (cd package && 7z a -tzip ../pathways-windows-x64.zip *)

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathways-windows-x64
          path: pathways-windows-x64.zip
          if-no-files-found: error

  # -----------------------------------------------------------------
  # Publish GitHub Release (Only on version tags, e.g. v1.0.0)
  # -----------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-linux-fedora, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pathways-linux-packages/*.rpm
            artifacts/pathways-linux-packages/*.tar.gz
            artifacts/pathways-windows-x64/pathways-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
