name: Windows Release (.exe Installer)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release on GitHub'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK (1.4+)
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader, glslc
          vulkan-use-cache: true

      - name: Setup MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure CMake (High-Performance Release)
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
            -DENABLE_NATIVE_OPTIMIZATION=ON \
            -DCPACK_GENERATOR="NSIS;ZIP"

      - name: Compile Pathways & Shaders
        shell: msys2 {0}
        run: |
          cmake --build build -j16

      - name: Run Unit Tests
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure -E "P2PDirectBar"

      - name: Package Windows Installer (NSIS) & Portable ZIP
        shell: msys2 {0}
        run: |
          cd build
          cpack -G NSIS
          cpack -G ZIP

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathways-windows-binaries
          path: |
            build/pathways-*-win64.exe
            build/pathways-*-win64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        with:
          files: |
            build/pathways-*-win64.exe
            build/pathways-*-win64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
