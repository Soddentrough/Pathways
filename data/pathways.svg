<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Ray Gradients -->
    <linearGradient id="incidentRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="cyanRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="purpleRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="redRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="prismFace1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="prismFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base App Canvas: Rounded Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Subtle BVH / Ray Grid Lines in Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="352" x2="432" y2="352" />
    <line x1="160" y1="80" x2="160" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="352" y1="80" x2="352" y2="432" />
  </g>

  <!-- Incident Ray Entering Prism -->
  <line x1="64" y1="120" x2="216" y2="246" stroke="url(#incidentRay)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <line x1="64" y1="120" x2="216" y2="246" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Dual-GPU Optical Prism / Dielectric Crystal -->
  <polygon points="256,110 376,330 136,330" fill="url(#prismFace1)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
  <polygon points="256,110 376,330 256,360" fill="url(#prismFace2)" stroke="#c084fc" stroke-width="2" stroke-linejoin="round" />
  <polygon points="256,110 136,330 256,360" fill="url(#prismFace1)" stroke="#06b6d4" stroke-width="2" stroke-linejoin="round" />

  <!-- Internal Path Tracer Bounces -->
  <polyline points="216,246 256,230 286,290" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.9" filter="url(#glow)" />

  <!-- Core Refraction Focus Point -->
  <circle cx="256" cy="230" r="32" fill="url(#coreGlow)" />
  <circle cx="256" cy="230" r="5" fill="#ffffff" />

  <!-- Refracted Dispersive Output Rays (Wavefronts) -->
  <!-- Ray 1: Deep Cyan -->
  <line x1="286" y1="290" x2="448" y2="240" stroke="url(#cyanRay)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="286" y1="290" x2="448" y2="240" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" />

  <!-- Ray 2: Electric Purple / Indigo -->
  <line x1="286" y1="290" x2="440" y2="300" stroke="url(#purpleRay)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="286" y1="290" x2="440" y2="300" stroke="#f3e8ff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Ray 3: Vibrant Rose / Magenta -->
  <line x1="286" y1="290" x2="420" y2="360" stroke="url(#redRay)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="286" y1="290" x2="420" y2="360" stroke="#ffe4e6" stroke-width="1.8" stroke-linecap="round" />

  <!-- Secondary Reflection Ray (Upwards Caustic) -->
  <line x1="216" y1="246" x2="310" y2="130" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" opacity="0.8" filter="url(#glow)" />

  <!-- Accent Geometry (Prism apex highlight) -->
  <circle cx="256" cy="110" r="4" fill="#38bdf8" />
  <circle cx="376" cy="330" r="4" fill="#a855f7" />
  <circle cx="136" cy="330" r="4" fill="#06b6d4" />
</svg>
